name: Top Genesis browser smoke test

on:
  push:
    branches:
      - integration/top-genesis-pdf-coach-20261109
    paths:
      - "top-genesis-pdf-parser.js"
      - "top-genesis-pdf-test.html"
      - "top-genesis-archive.js"
      - "index.html"
      - "tests/top-genesis-browser-smoke.mjs"
      - "tests/trainee-navigation-avatar-regression.mjs"
      - "top-genesis-pdf-app-embed.js"
      - "top-genesis-publication.js"
      - "supabase/migrations/202611120001_top_genesis_publications.sql"
      - ".github/workflows/top-genesis-browser-smoke.yml"
  pull_request:
    paths:
      - "top-genesis-pdf-parser.js"
      - "top-genesis-pdf-test.html"
      - "top-genesis-archive.js"
      - "top-genesis-pdf-app-embed.js"
      - "index.html"
      - "tests/top-genesis-browser-smoke.mjs"
      - "tests/trainee-navigation-avatar-regression.mjs"
      - ".github/workflows/top-genesis-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check publication module syntax
        run: node --check top-genesis-publication.js
      - name: Install browser test dependencies
        run: npm install --no-save playwright pdf-lib
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test PDF.js and OCR in Chromium
        run: node tests/top-genesis-browser-smoke.mjs
      - name: Test trainee avatar loading and Back navigation regressions
        run: node tests/trainee-navigation-avatar-regression.mjs
