name: Pinned Supabase SDK loader test

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'vendor/supabase-2.119.0.js'
      - 'vendor/supabase-2.119.0.js.sha256'
      - 'vendor/SUPABASE-SDK-VERSION.txt'
      - 'vendor/SUPABASE-SDK-LICENSE.txt'
      - 'tests/supabase-sdk-loader.static.test.js'
      - '.github/workflows/test-supabase-sdk-loader.yml'
  push:
    branches:
      - fix/pinned-supabase-loader-20261113
    paths:
      - 'index.html'
      - 'vendor/supabase-2.119.0.js'
      - 'vendor/supabase-2.119.0.js.sha256'
      - 'vendor/SUPABASE-SDK-VERSION.txt'
      - 'vendor/SUPABASE-SDK-LICENSE.txt'
      - 'tests/supabase-sdk-loader.static.test.js'
      - '.github/workflows/test-supabase-sdk-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-sdk-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned SDK and simulate loader success/failure paths
        run: node tests/supabase-sdk-loader.static.test.js
