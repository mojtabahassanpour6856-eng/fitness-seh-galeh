name: Browser test experimental workout planner
on:
  push:
    branches:
      - coach-workout-editor-isolated-preview
      - workout-save-policy-parity-ci-v2
    paths:
      - 'experiments/workout-template-planner.html'
      - 'fitness_seh_galeh_FINAL_CLEAN2.html'
      - 'experiments/workout-persistence-adapter.js'
      - 'tests/workout-planner-browser.test.js'
      - 'tests/workout-save-sql-draft.test.js'
      - 'tests/postgres-workout-save.integration.sql'
      - 'tests/postgres-workout-save-concurrency.sh'
      - 'tests/postgres-workout-save-fixture.sql'
      - 'experiments/sql/save_trainee_workout_plan_transaction.sql'
      - 'experiments/WORKOUT_SAVE_RPC_REVIEW_CHECKLIST.md'
      - 'experiments/WORKOUT_SAVE_AUTOMATED_TEST_RUN_REVIEW.md'
      - 'experiments/PRODUCTION_WORKOUT_SAVE_CALLSITE_AUDIT.md'
      - 'experiments/production-derived-index.html'
      - 'tests/production-workout-atomic-prototype.test.js'
      - 'docs/WORKOUT_CONCURRENCY_RELEASE_GATE.md'
      - 'docs/WORKOUT_COMPLETION_POLICY_TEST_MATRIX.md'
      - '.github/workflows/test-workout-planner-browser.yml'
  pull_request:
    branches:
      - coach-workout-editor-isolated-preview
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Static guardrails for SQL draft (no database access)
        run: node tests/workout-save-sql-draft.test.js
      - name: Verify production-derived atomic save prototype and unchanged surrounding app
        run: node tests/production-workout-atomic-prototype.test.js
      - name: Serve repository files
        run: python3 -m http.server 4173 --directory . >/tmp/workout-planner-http.log 2>&1 &
      - name: Test planner in Chromium
        run: node tests/workout-planner-browser.test.js

  postgres-integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: workout_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build disposable PostgreSQL fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres-workout-save-fixture.sql
      - name: Install draft function in disposable PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f experiments/sql/save_trainee_workout_plan_transaction.sql
      - name: Test save, replacement, authorization, invalid exercise, and rollback
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres-workout-save.integration.sql
      - name: Test concurrent saves reject stale snapshot
        run: bash tests/postgres-workout-save-concurrency.sh
