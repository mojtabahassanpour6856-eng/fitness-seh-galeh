name: Browser test experimental workout planner
on:
  push:
    branches:
      - coach-workout-editor-experiment
      - coach-workout-mobile-stabilization-20261022
    paths:
      - 'experiments/workout-template-planner.html'
      - 'fitness_seh_galeh_FINAL_CLEAN2.html'
      - 'experiments/workout-persistence-adapter.js'
      - 'experiments/atomic-workout-rpc-adapter.js'
      - 'tests/workout-planner-browser.test.js'
      - 'tests/mobile-workout-layout.test.js'
      - '.github/workflows/test-workout-planner-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        timeout-minutes: 8
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium and system dependencies
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Serve repository files
        run: python3 -m http.server 4173 --directory . >/tmp/workout-planner-http.log 2>&1 &
      - name: Test planner in Chromium
        timeout-minutes: 8
        run: node tests/workout-planner-browser.test.js
      - name: Check phone-width layout
        timeout-minutes: 5
        run: node tests/mobile-workout-layout.test.js
