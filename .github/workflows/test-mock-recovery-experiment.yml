name: Experimental password recovery mock and PostgreSQL tests
# Disposable PostgreSQL suite also checks PostgREST-safe service-role-only RPC wrappers with named SQL dollar tags.

on:
  push:
    branches:
      - experiment/trainee-password-recovery-mock-20261122
    paths:
      - 'docs/experimental/mock-recovery-engine.js'
      - 'docs/experimental/recovery-outbox-worker-model.js'
      - 'docs/experimental/recovery-outbox-worker-mock.mjs'
      - 'docs/experimental/test-recovery-outbox-worker-mock.mjs'
      - 'docs/experimental/test-recovery-outbox-worker-model.js'
      - 'docs/experimental/migrations/20261122_recovery_outbox_worker_candidate.sql'
      - 'docs/experimental/migrations/20261122_recovery_encrypted_delivery_payload_candidate.sql'
      - 'docs/experimental/test-recovery-outbox-postgres.js'
      - 'docs/experimental/test-mock-recovery.js'
      - 'docs/experimental/test-recovery-crypto.js'
      - 'docs/experimental/test-recovery-http-smoke.js'
      - 'docs/experimental/test-recovery-http-smoke-contract.js'
      - 'docs/experimental/test-recovery-authorization-abuse.js'
      - 'docs/experimental/recovery-candidate-core.mjs'
      - 'docs/experimental/test-recovery-candidate-core.js'
      - 'docs/experimental/recovery-delivery-payload-crypto.mjs'
      - 'docs/experimental/test-recovery-delivery-payload-crypto.mjs'
      - 'docs/experimental/recovery-candidate-handler.mjs'
      - 'docs/experimental/test-recovery-candidate-handler.js'
      - 'docs/experimental/trainee-password-recovery-edge-candidate.ts'
      - 'docs/experimental/test-recovery-edge-adapter-contract.js'
      - 'docs/experimental/test-recovery-handler-sql-contract.js'
      - 'docs/experimental/migrations/20261122_recovery_atomic_rpc_candidate.sql'
      - 'docs/experimental/migrations/20261122_dispose_expired_legacy_approved_request.sql'
      - 'docs/experimental/test-recovery-atomic-rpc-candidate.js'
      - 'docs/experimental/postgres-concurrency-test.js'
      - 'docs/experimental/migrations/20261122_include_processing_in_active_recovery_unique_index.sql'
      - '.github/workflows/test-mock-recovery-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/trainee-password-recovery-mock-20261122
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated mock recovery tests
        run: node docs/experimental/test-mock-recovery.js
      - name: Run fenced Outbox/Worker model tests (no provider or database)
        run: node docs/experimental/test-recovery-outbox-worker-model.js
      - name: Run fake-provider-only encrypted Outbox worker tests
        run: node docs/experimental/test-recovery-outbox-worker-mock.mjs
      - name: Run focused cryptographic boundary tests
        run: node docs/experimental/test-recovery-crypto.js
      - name: Verify live HTTP smoke harness cannot mutate recovery state
        run: node docs/experimental/test-recovery-http-smoke-contract.js
      - name: Run focused authorization and abuse regressions
        run: node docs/experimental/test-recovery-authorization-abuse.js
      - name: Run candidate security primitive tests (isolated only)
        run: node docs/experimental/test-recovery-candidate-core.js
      - name: Run dependency-injected recovery handler candidate tests (isolated only)
        run: node docs/experimental/test-recovery-candidate-handler.js
      - name: Test encrypted recovery delivery payload envelope (no provider or secrets)
        run: node docs/experimental/test-recovery-delivery-payload-crypto.mjs
      - name: Verify Edge adapter remains non-deployable and provider-disabled
        run: node docs/experimental/test-recovery-edge-adapter-contract.js
      - name: Verify handler and candidate migration contract alignment
        run: node docs/experimental/test-recovery-handler-sql-contract.js

  deno-edge-candidate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/trainee-password-recovery-mock-20261122
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check non-deployable Edge adapter candidate
        run: deno check docs/experimental/trainee-password-recovery-edge-candidate.ts

  postgres-concurrency-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/trainee-password-recovery-mock-20261122
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client driver
        run: npm install --no-save pg
      - name: Run two-session PostgreSQL concurrency checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: recovery_ci
        run: node docs/experimental/postgres-concurrency-test.js
      - name: Run atomic recovery RPC candidate tests (disposable PostgreSQL only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: recovery_ci
        run: node docs/experimental/test-recovery-atomic-rpc-candidate.js
      - name: Run fenced Outbox/Worker PostgreSQL integration tests (disposable only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: recovery_ci
        run: node docs/experimental/test-recovery-outbox-postgres.js
