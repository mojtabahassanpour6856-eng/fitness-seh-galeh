name: Coach membership payment RPC draft tests

on:
  push:
    branches:
      - prototype/coach-membership-payment-rpc-20261114
    paths:
      - 'supabase/drafts/20261114000100_receipt_membership_link.sql'
      - 'supabase/drafts/20261114000300_create_coach_membership_with_payment_rpc.sql'
      - 'tests/financial-receipt-idempotency.fixture.sql'
      - 'tests/coach-membership-payment-rpc.integration.sql'
      - '.github/workflows/test-coach-membership-payment-rpc.yml'
  pull_request:
    branches:
      - prototype/receipt-membership-client-draft-20261114
    paths:
      - 'supabase/drafts/20261114000100_receipt_membership_link.sql'
      - 'supabase/drafts/20261114000300_create_coach_membership_with_payment_rpc.sql'
      - 'tests/financial-receipt-idempotency.fixture.sql'
      - 'tests/coach-membership-payment-rpc.integration.sql'
      - '.github/workflows/test-coach-membership-payment-rpc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coach-membership-payment-rpc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coach_membership_payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coach_membership_payment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: coach_membership_payment_test
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated coach membership/payment RPC tests
        run: psql -v ON_ERROR_STOP=1 -f tests/coach-membership-payment-rpc.integration.sql
