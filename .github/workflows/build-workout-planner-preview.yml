name: Build isolated workout planner preview bundle

on:
  push:
    branches: ["coach-workout-editor-isolated-preview"]
    paths:
      - "experiments/workout-template-planner.html"
      - "experiments/workout-persistence-adapter.js"
      - "experiments/test-coach-host.html"
      - ".github/workflows/build-workout-planner-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch only
        uses: actions/checkout@v4
        with:
          ref: coach-workout-editor-isolated-preview
      - name: Prepare isolated static preview bundle
        run: |
          mkdir -p preview-bundle
          cp experiments/workout-template-planner.html preview-bundle/index.html
          cp experiments/workout-persistence-adapter.js preview-bundle/workout-persistence-adapter.js
          cp experiments/test-coach-host.html preview-bundle/test-coach-host.html
          cat > preview-bundle/README.txt <<'EOF'
          Fitness Seh Galeh - experimental workout planner preview
          
          This bundle is built from branch coach-workout-editor-isolated-preview.
          It is an artifact only. This workflow does NOT deploy GitHub Pages,
          does NOT modify main, and does NOT write to Supabase.
          
          test-coach-host.html is an isolated sandbox login host for the test Supabase project.
          Keep the host and planner on the same origin when testing popup/opener integration.
          Never enter production credentials. This bundle is not deployed automatically.
          EOF
      - name: Validate preview bundle contents
        run: |
          test -s preview-bundle/index.html
          test -s preview-bundle/workout-persistence-adapter.js
          test -s preview-bundle/test-coach-host.html
          grep -q 'workout-persistence-adapter.js' preview-bundle/index.html
          grep -q 'udptdznbvewkublvzmtm.supabase.co' preview-bundle/test-coach-host.html
          grep -q 'does NOT deploy GitHub Pages' preview-bundle/README.txt
          echo "Preview bundle checks passed; deployment and Supabase writes are not performed."
      - name: Upload preview bundle (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: workout-planner-experiment-preview
          path: preview-bundle/
          if-no-files-found: error
          retention-days: 7
