name: Auth session lifecycle watchdog regression
on:
  pull_request:
    branches: [main]
    paths: ['index.html','tests/auth-session-lifecycle-watchdog.test.mjs','.github/workflows/test-auth-session-lifecycle-watchdog.yml']
  push:
    branches: [fix/pinned-supabase-loader-20261113]
    paths: ['index.html','tests/auth-session-lifecycle-watchdog.test.mjs','.github/workflows/test-auth-session-lifecycle-watchdog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/auth-session-lifecycle-watchdog.test.mjs
