name: Anatomy experiment checks

on:
  push:
    branches:
      - experiment/anatomy-smart-rebuild-20261127
    paths:
      - 'experiments/anatomy-*.js'
      - 'experiments/anatomy-*.json'
      - 'experiments/ANATOMY-*.json'
      - 'experiments/ANATOMY-*.md'
      - 'experiments/anatomy-smart-prototype.html'
      - 'experiments/anatomy-preview-capture.html'
      - 'experiments/anatomy-preview-gallery.html'
      - 'experiments/anatomy-geometry-inspector.html'
      - 'tests/anatomy-*.test.js'
      - '.github/workflows/anatomy-experiment-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anatomy-experiment-checks
  cancel-in-progress: true

jobs:
  anatomy-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/anatomy-smart-rebuild-20261127
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check experiments/anatomy-exercise-adapter.js
          node --check experiments/anatomy-selection-integration.js
      - name: Run anatomy regression tests
        run: |
          node tests/anatomy-exercise-adapter.test.js
          node tests/anatomy-selection-integration-static.test.js
          node tests/anatomy-catalog-integrity.test.js
          node tests/anatomy-geometry-inspector-export.test.js
      - name: Install headless browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Capture real anatomy preview
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python3 -m http.server 8765 --directory experiments >/tmp/anatomy-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/anatomy-smart-prototype.html >/dev/null; then break; fi
            sleep 1
          done
          for view in male-front male-back female-front female-back; do
            "$CHROME_PATH" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1800 --virtual-time-budget=7000 --screenshot="/tmp/anatomy-${view}.png" "http://127.0.0.1:8765/anatomy-preview-capture.html?view=${view}"
            test -s "/tmp/anatomy-${view}.png"
          done
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1800,2600 --virtual-time-budget=18000 --screenshot=/tmp/anatomy-preview-gallery.png "http://127.0.0.1:8765/anatomy-preview-gallery.html"
          test -s /tmp/anatomy-preview-gallery.png
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1200 --virtual-time-budget=9000 --screenshot=/tmp/anatomy-geometry-inspector.png "http://127.0.0.1:8765/anatomy-geometry-inspector.html?sex=male&view=front"
          test -s /tmp/anatomy-geometry-inspector.png
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "http://127.0.0.1:8765/anatomy-smart-prototype.html?smoke=1" >/tmp/anatomy-dom.html
          grep -q 'id="bodySvg"' /tmp/anatomy-dom.html
          grep -q 'id="pairStatus"' /tmp/anatomy-dom.html
          grep -q 'id="anatomySmoke" data-total-paths="116" data-visible-paths="29" data-pair-status="ready"' /tmp/anatomy-dom.html
          grep -q 'id="anatomyInteractionSmoke" data-result="pass"' /tmp/anatomy-dom.html
          grep -q 'حرکات مرتبط از بانک مربی' /tmp/anatomy-dom.html
      - name: Upload anatomy preview image
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-preview
          path: |
            /tmp/anatomy-male-front.png
            /tmp/anatomy-male-back.png
            /tmp/anatomy-female-front.png
            /tmp/anatomy-female-back.png
            /tmp/anatomy-dom.html
            /tmp/anatomy-geometry-inspector.png
            /tmp/anatomy-preview-gallery.png
          if-no-files-found: error
          retention-days: 3
