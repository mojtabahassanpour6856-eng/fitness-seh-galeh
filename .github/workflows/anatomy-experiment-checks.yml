name: Anatomy experiment checks

on:
  push:
    branches:
      - experiment/anatomy-smart-rebuild-20261127
    paths:
      - 'experiments/anatomy-*.js'
      - 'experiments/anatomy-*.json'
      - 'experiments/ANATOMY-*.json'
      - 'experiments/ANATOMY-*.md'
      - 'experiments/anatomy-smart-prototype.html'
      - 'experiments/anatomy-preview-capture.html'
      - 'experiments/anatomy-preview-gallery.html'
      - 'experiments/anatomy-deltoid-path-review.html'
      - 'experiments/anatomy-geometry-inspector.html'
      - 'tests/anatomy-*.test.js'
      - '.github/workflows/anatomy-experiment-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anatomy-experiment-checks
  cancel-in-progress: true

jobs:
  anatomy-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/anatomy-smart-rebuild-20261127
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check experiments/anatomy-exercise-adapter.js
          node --check experiments/anatomy-selection-integration.js
          node --check experiments/anatomy-muscle-browser.js
      - name: Run anatomy regression tests
        run: |
          node tests/anatomy-exercise-adapter.test.js
          node tests/anatomy-selection-integration-static.test.js
          node tests/anatomy-catalog-integrity.test.js
          node tests/anatomy-geometry-inspector-export.test.js
          node tests/anatomy-preview-gallery.test.js
          node tests/anatomy-deltoid-path-review.test.js
          node tests/anatomy-muscle-browser.test.js
      - name: Install headless browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Capture real anatomy preview
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python3 -m http.server 8765 --directory experiments >/tmp/anatomy-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/anatomy-smart-prototype.html >/dev/null; then break; fi
            sleep 1
          done
          for view in male-front male-back female-front female-back; do
            case "$view" in
              male-front|female-front) expected_paths=28 ;;
              male-back|female-back) expected_paths=30 ;;
            esac
            "$CHROME_PATH" --headless --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom "http://127.0.0.1:8765/anatomy-preview-capture.html?view=${view}" >"/tmp/anatomy-${view}-dom.html"
            grep -q 'data-capture-ready="true"' "/tmp/anatomy-${view}-dom.html"
            grep -q "data-path-count=\"${expected_paths}\"" "/tmp/anatomy-${view}-dom.html"
            grep -q "data-expected-path-count=\"${expected_paths}\"" "/tmp/anatomy-${view}-dom.html"
            grep -q 'data-controls-match="true"' "/tmp/anatomy-${view}-dom.html"
            grep -q 'data-title-match="true"' "/tmp/anatomy-${view}-dom.html"
            "$CHROME_PATH" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1800 --virtual-time-budget=7000 --screenshot="/tmp/anatomy-${view}.png" "http://127.0.0.1:8765/anatomy-preview-capture.html?view=${view}"
            test -s "/tmp/anatomy-${view}.png"
          done
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:8765/anatomy-preview-gallery.html" >/tmp/anatomy-gallery-dom.html
          grep -q 'data-gallery-ready="true"' /tmp/anatomy-gallery-dom.html
          grep -q 'data-loaded-views="male-front,male-back,female-front,female-back"' /tmp/anatomy-gallery-dom.html
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1800,2600 --virtual-time-budget=18000 --screenshot=/tmp/anatomy-preview-gallery.png "http://127.0.0.1:8765/anatomy-preview-gallery.html"
          test -s /tmp/anatomy-preview-gallery.png
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:8765/anatomy-deltoid-path-review.html" >/tmp/anatomy-deltoid-review-dom.html
          grep -q 'data-review-ready="true"' /tmp/anatomy-deltoid-review-dom.html
          grep -q 'data-loaded-views="male-front,male-back,female-front,female-back"' /tmp/anatomy-deltoid-review-dom.html
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1800,2600 --virtual-time-budget=18000 --screenshot=/tmp/anatomy-deltoid-review.png "http://127.0.0.1:8765/anatomy-deltoid-path-review.html"
          test -s /tmp/anatomy-deltoid-review.png
          for model in male female; do
            for direction in front back; do
              case "$direction" in
                front) inspector_expected=28 ;;
                back) inspector_expected=30 ;;
              esac
              "$CHROME_PATH" --headless --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom "http://127.0.0.1:8765/anatomy-geometry-inspector.html?sex=${model}&view=${direction}" >"/tmp/anatomy-inspector-${model}-${direction}-dom.html"
              grep -q 'data-inspector-ready="true"' "/tmp/anatomy-inspector-${model}-${direction}-dom.html"
              grep -q "data-path-count=\"${inspector_expected}\"" "/tmp/anatomy-inspector-${model}-${direction}-dom.html"
              ! grep -q 'data-inspector-error="true"' "/tmp/anatomy-inspector-${model}-${direction}-dom.html"
              "$CHROME_PATH" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1600 --virtual-time-budget=9000 --screenshot="/tmp/anatomy-inspector-${model}-${direction}.png" "http://127.0.0.1:8765/anatomy-geometry-inspector.html?sex=${model}&view=${direction}"
              test -s "/tmp/anatomy-inspector-${model}-${direction}.png"
            done
          done
          # Focused multi-path review sheets for the four known ambiguous source groups.
          while read -r model direction group expected; do
            name="${model}-${direction}-${group,,}"
            url="http://127.0.0.1:8765/anatomy-geometry-inspector.html?sex=${model}&view=${direction}&group=${group}"
            "$CHROME_PATH" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$url" >"/tmp/anatomy-group-review-${name}-dom.html"
            grep -q 'data-inspector-ready="true"' "/tmp/anatomy-group-review-${name}-dom.html"
            grep -q 'data-group-review-ready="true"' "/tmp/anatomy-group-review-${name}-dom.html"
            grep -q "data-group-review-group=\"${group}\"" "/tmp/anatomy-group-review-${name}-dom.html"
            grep -q "data-group-review-count=\"${expected}\"" "/tmp/anatomy-group-review-${name}-dom.html"
            "$CHROME_PATH" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1800,1900 --virtual-time-budget=12000 --screenshot="/tmp/anatomy-group-review-${name}.png" "$url"
            test -s "/tmp/anatomy-group-review-${name}.png"
          done <<'GROUP_REVIEWS'
          male front QUADS 4
          female front QUADS 4
          male back TRAPEZIUS 4
          female back TRAPEZIUS 4
          GROUP_REVIEWS
          cp /tmp/anatomy-inspector-male-front.png /tmp/anatomy-geometry-inspector.png
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "http://127.0.0.1:8765/anatomy-smart-prototype.html?smoke=1" >/tmp/anatomy-dom.html
          grep -q 'id="bodySvg"' /tmp/anatomy-dom.html
          grep -q 'id="pairStatus"' /tmp/anatomy-dom.html
          grep -q 'id="anatomySmoke" data-total-paths="116" data-visible-paths="28" data-pair-status="ready"' /tmp/anatomy-dom.html
          grep -q 'id="anatomyInteractionSmoke" data-result="pass"' /tmp/anatomy-dom.html
          grep -q 'حرکات مرتبط از بانک مربی' /tmp/anatomy-dom.html
          grep -q 'id="anatomyMuscleBrowserSmoke" data-result="pass"' /tmp/anatomy-dom.html
      - name: Upload anatomy preview image and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-preview
          path: |
            /tmp/anatomy-male-front.png
            /tmp/anatomy-male-back.png
            /tmp/anatomy-female-front.png
            /tmp/anatomy-female-back.png
            /tmp/anatomy-dom.html
            /tmp/anatomy-geometry-inspector.png
            /tmp/anatomy-inspector-dom.html
            /tmp/anatomy-inspector-*-front.png
            /tmp/anatomy-inspector-*-back.png
            /tmp/anatomy-inspector-*-front-dom.html
            /tmp/anatomy-inspector-*-back-dom.html
            /tmp/anatomy-group-review-*.png
            /tmp/anatomy-group-review-*-dom.html
            /tmp/anatomy-preview-gallery.png
            /tmp/anatomy-deltoid-review.png
            /tmp/anatomy-deltoid-review-dom.html
            /tmp/anatomy-male-front-dom.html
            /tmp/anatomy-male-back-dom.html
            /tmp/anatomy-female-front-dom.html
            /tmp/anatomy-female-back-dom.html
            /tmp/anatomy-gallery-dom.html
            /tmp/anatomy-http.log
          if-no-files-found: warn
          retention-days: 3
