name: Financial receipt idempotency fixture
on:
  push:
    branches:
      - prototype/receipt-idempotency-fixture-20261114
    paths:
      - 'tests/financial-receipt-idempotency.fixture.sql'
      - 'tests/financial-receipt-idempotency.integration.sql'
      - '.github/workflows/test-financial-receipt-idempotency.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/financial-receipt-idempotency.fixture.sql'
      - 'tests/financial-receipt-idempotency.integration.sql'
      - '.github/workflows/test-financial-receipt-idempotency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-idempotency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_receipt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financial_receipt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: financial_receipt_test
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated synthetic receipt workflow tests
        run: psql -v ON_ERROR_STOP=1 -f tests/financial-receipt-idempotency.integration.sql
