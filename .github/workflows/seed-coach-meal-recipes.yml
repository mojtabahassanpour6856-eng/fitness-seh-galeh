name: Seed coach meal recipe bank (experimental branch)
on:
  push:
    branches:
      - feat/coach-meal-recipe-bank-20261028
    paths:
      - 'scripts/seed-coach-meal-recipes.js'
      - 'tests/coach-meal-recipes-static.test.js'
      - '.github/workflows/seed-coach-meal-recipes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coach-meal-recipe-bank-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed the existing meal recipe array (idempotent)
        run: node scripts/seed-coach-meal-recipes.js
      - name: Validate every inline JavaScript block
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          let failed = false, count = 0;
          for (const [i, match] of scripts.entries()) {
            if (/\bsrc\s*=/.test(match[1]) || !match[2].trim()) continue;
            count++;
            const file = `/tmp/inline-${i}.js`;
            fs.writeFileSync(file, match[2]);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              failed = true;
              console.error(`Syntax error in inline script ${i}:`);
              console.error(result.stderr || result.stdout);
            }
          }
          console.log(`Checked ${count} inline scripts.`);
          if (failed) process.exit(1);
          NODE
      - name: Run existing coach dashboard regression test
        run: node tests/coach-plan-status-static.test.js
      - name: Test the seeded recipe bank and category placement
        run: node tests/coach-meal-recipes-static.test.js
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit seeded recipes to this experimental branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add prebuilt coach meal recipes by meal category"
          git push origin "HEAD:${GITHUB_REF_NAME}"
