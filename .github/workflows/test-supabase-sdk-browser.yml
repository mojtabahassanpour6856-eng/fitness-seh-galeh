name: Supabase SDK real-browser startup test

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'vendor/supabase-2.119.0.js'
      - 'tests/supabase-sdk-loader.browser.mjs'
      - '.github/workflows/test-supabase-sdk-browser.yml'
  push:
    branches:
      - fix/pinned-supabase-loader-20261113
    paths:
      - 'index.html'
      - 'vendor/supabase-2.119.0.js'
      - 'tests/supabase-sdk-loader.browser.mjs'
      - '.github/workflows/test-supabase-sdk-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-engine-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium, Firefox and WebKit test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Test production startup in three browser engines with simulated SDK 404
        run: node tests/supabase-sdk-loader.browser.mjs

# Keep this workflow self-triggering for subsequent branch updates.
