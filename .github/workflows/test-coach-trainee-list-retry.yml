name: Coach trainee-list retry regression
on:
  pull_request:
    branches: [main]
    paths: ['index.html','tests/coach-trainee-list-retry.test.mjs','.github/workflows/test-coach-trainee-list-retry.yml']
  push:
    branches: [fix/pinned-supabase-loader-20261113]
    paths: ['index.html','tests/coach-trainee-list-retry.test.mjs','.github/workflows/test-coach-trainee-list-retry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coach-list-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/coach-trainee-list-retry.test.mjs
