name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Create Android app wrapper
        run: |
          mkdir apk-wrapper
          cd apk-wrapper
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          printf '<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body>در حال باز کردن برنامه…</body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.fitnesssehgaleh.morabiman",
            "appName": "Fitness Seh Galeh",
            "webDir": "www",
            "server": {
              "url": "https://mojtabahassanpour6856-eng.github.io/fitness-seh-galeh/",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
      - name: Build debug APK
        run: |
          cd apk-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-seh-galeh-debug-apk
          path: apk-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
