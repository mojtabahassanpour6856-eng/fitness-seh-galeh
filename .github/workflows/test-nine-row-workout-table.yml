name: Nine-row workout table browser test

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/test-nine-row-workout-table.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workout-table-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --save-dev --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Verify nine-row table in desktop and mobile browser
        run: |
          cat > nine-row-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'domcontentloaded' });
            await page.addStyleTag({ content: '#authScreen { display:none !important; }' });
            const section = page.locator('#workout');
            await section.evaluate(el => el.classList.add('active'));
            const table = page.locator('#workoutNineTable');
            await table.waitFor();
            assert.equal(await table.locator('tbody tr').count(), 9, 'table must contain exactly nine rows');
            const expected = ['normal','superset','triset','giant','drop','rest_pause','timed','multi_stage','custom'];
            for (const row of await table.locator('tbody tr').all()) {
              const systems = await row.locator('select.w9-system option').evaluateAll(opts => opts.map(o => o.value));
              assert.deepEqual(systems, expected, 'each row must expose all nine training systems');
              assert.equal(await row.locator('select.w9-exercise').count(), 1);
              assert.equal(await row.locator('.w9-movement-checklist').count(), 1);
              assert.equal(await row.locator('input.w9-rest').count(), 1);
              assert.equal(await row.locator('input.w9-reps').count(), 1);
              assert.equal(await row.locator('input.w9-sets').count(), 1);
            }
            // Group systems should reveal checkboxes on the same row, with the required selection count.
            const groupingRows = await table.locator('tbody tr').all();
            await groupingRows[0].locator('.w9-system').selectOption('superset');
            assert.equal(await groupingRows[0].locator('.w9-group-movement-toggle').isVisible(), true, 'superset should expose the same-row movement picker');
            await groupingRows[0].locator('.w9-group-movement-toggle').click();
            assert.equal(await groupingRows[0].locator('.w9-movement-checklist').isVisible(), true, 'superset movement checklist should open on demand');
            await groupingRows[3].locator('.w9-system').selectOption('triset');
            assert.equal(await groupingRows[3].locator('.w9-group-movement-toggle').isVisible(), true, 'triset should expose the same-row movement picker');
            await groupingRows[3].locator('.w9-group-movement-toggle').click();
            assert.equal(await groupingRows[3].locator('.w9-movement-checklist').isVisible(), true, 'triset movement checklist should open on demand');
            await groupingRows[6].locator('.w9-system').selectOption('giant');
            assert.equal(await groupingRows[6].locator('.w9-group-movement-toggle').isVisible(), true, 'giant set should expose the same-row movement picker');
            await groupingRows[6].locator('.w9-group-movement-toggle').click();
            assert.equal(await groupingRows[6].locator('.w9-movement-checklist').isVisible(), true, 'giant-set movement checklist should open on demand');
            // Simulate the exercise list becoming available; the table should mirror its options.
            await page.locator('#workoutExercise').evaluate(sel => {
              const opt = document.createElement('option');
              opt.value = 'test-exercise-id';
              opt.textContent = 'حرکت آزمایشی';
              sel.appendChild(opt);
            });
            await page.waitForFunction(() => {
              const sel = document.querySelector('#workoutNineTable .w9-exercise');
              return !!sel && Array.from(sel.options).some(o => o.value === 'test-exercise-id');
            });
            await page.waitForFunction(() => {
              const box = document.querySelector('#workoutNineTable .w9-movement-checklist');
              return !!box && Array.from(box.querySelectorAll('input')).some(o => o.value === 'test-exercise-id');
            });
            assert.equal(await table.locator('tbody tr').first().locator('.w9-movement-checklist input[value="test-exercise-id"]').count(), 1, 'exercise options should sync into the same-row checklist');
            await page.setViewportSize({ width: 390, height: 844 });
            const mobile = await page.locator('.workout-nine-table-scroll').evaluate(el => ({
              overflowX: getComputedStyle(el).overflowX,
              clientWidth: el.clientWidth,
              scrollWidth: el.scrollWidth
            }));
            assert.ok(['auto','scroll'].includes(mobile.overflowX), 'mobile table wrapper must allow horizontal scrolling');
            await page.screenshot({ path: 'nine-row-table-mobile.png', fullPage: false });
            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.screenshot({ path: 'nine-row-table-desktop.png', fullPage: false });
            console.log(JSON.stringify({ rows: 9, systems: expected, movementOptionsSync: true, mobile }, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node nine-row-check.cjs
      - name: Verify save handler safeguards and batch insert
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('window.saveWorkoutNineTable=async function');
          assert.ok(start >= 0, 'nine-row save handler must exist');
          const end = html.indexOf('function start(){', start);
          assert.ok(end > start, 'could not find end of nine-row save handler');
          const handler = html.slice(start, end);
          assert.match(handler, /workout_plan_id:currentWorkoutPlanId/, 'must use current plan id, not a window property');
          assert.match(handler, /sbWrite\('\/trainee_workout_exercises','POST',payloads\)/, 'must use one multi-row insert');
          assert.match(handler, /inserted\.length!==payloads\.length/, 'must check all rows were returned');
          assert.match(handler, /training_day\|is_completed/i, 'must retain optional-column compatibility fallback');
          console.log('PASS: nine-row save handler uses the corrected plan ID and batch-insert safeguards.');
          NODE
      - name: Exercise the actual save handler with a mocked database (no live data)
        run: |
          cat > nine-row-save-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            page.on('dialog', d => d.accept());
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'domcontentloaded' });
            await page.addStyleTag({ content: '#authScreen { display:none !important; }' });
            await page.locator('#workout').evaluate(el => el.classList.add('active'));
            await page.evaluate(() => {
              const source = document.querySelector('#workoutExercise');
              for (let i = 1; i <= 9; i++) {
                const o = document.createElement('option'); o.value = 'test-exercise-' + i; o.textContent = 'حرکت آزمایشی ' + i; source.appendChild(o);
              }
              // Assign the app's top-level lexical state without authenticating or touching Supabase.
              eval('currentClient = { id: "test-trainee" }; currentWorkoutPlanId = 123; workoutExercisesCache = [];');
              window.loadWorkoutForClient = async () => {};
            });
            const rows = await page.locator('#workoutNineTable tbody tr').all();
            const systems = ['normal','superset','triset','giant','drop','rest_pause','timed','multi_stage','custom'];
            const rowExercises = [['test-exercise-1'],['test-exercise-2','test-exercise-3'],['test-exercise-4','test-exercise-5','test-exercise-6'],['test-exercise-7','test-exercise-8','test-exercise-9'],['test-exercise-1'],['test-exercise-2'],['test-exercise-3'],['test-exercise-4'],['test-exercise-5']];
            for (let i = 0; i < rows.length; i++) {
              await rows[i].locator('.w9-system').selectOption(systems[i]);
              if (['superset','triset','giant'].includes(systems[i])) {
                for (const id of rowExercises[i]) await rows[i].locator('.w9-exercise-check[value="' + id + '"]').check();
              } else {
                await rows[i].locator('.w9-exercise').selectOption(rowExercises[i][0]);
              }
              // These numeric fields are enhanced with visible touch-choice controls; set the underlying inputs directly in this isolated browser test.
              await rows[i].evaluate((tr, values) => {
                for (const [selector, value] of values) {
                  const input = tr.querySelector(selector);
                  input.value = value;
                  input.dispatchEvent(new Event('input', { bubbles: true }));
                  input.dispatchEvent(new Event('change', { bubbles: true }));
                }
              }, [
                ['.w9-rest', String(30 + i)],
                ['.w9-reps', i === 4 ? '12+8+6' : String(8 + i)],
                ['.w9-sets', String(2 + (i % 3))]
              ]);
            }
            const first = await page.evaluate(async () => {
              let captured;
              window.sbWrite = async (url, method, payload) => { captured = { url, method, payload }; return payload.map((x,i) => ({...x,id:i+1})); };
              await window.saveWorkoutNineTable();
              return captured;
            });
            assert.equal(first.url, '/trainee_workout_exercises');
            assert.equal(first.method, 'POST');
            const expectedIds = rowExercises.flat();
            const expectedSystems = systems.flatMap(s => [s === 'superset' ? 'superset' : s, ...(s === 'superset' ? ['superset'] : s === 'triset' || s === 'giant' ? [s,s] : [])]);
            assert.equal(first.payload.length, 14, 'same-row grouped movements must all be sent together');
            assert.deepEqual(first.payload.map(x => x.training_system), expectedSystems);
            assert.deepEqual(first.payload.map(x => x.exercise_id), expectedIds);
            assert.ok(first.payload.every(x => x.workout_plan_id === 123));
            assert.equal(first.payload[1].group_key, first.payload[2].group_key, 'two same-row superset movements must share a group key');
            assert.equal(first.payload[3].group_key, first.payload[5].group_key, 'three same-row triset movements must share a group key');
            assert.equal(first.payload[6].group_key, first.payload[8].group_key, 'three same-row giant-set movements must share a group key');
            assert.equal(first.payload[0].group_key, null);
            assert.equal(first.payload[9].group_key, null);
            // Refill after success and verify the optional-column fallback path too.
            for (let i = 0; i < rows.length; i++) {
              await rows[i].locator('.w9-system').selectOption(systems[i]);
              if (['superset','triset','giant'].includes(systems[i])) {
                for (const id of rowExercises[i]) await rows[i].locator('.w9-exercise-check[value="' + id + '"]').check();
              } else {
                await rows[i].locator('.w9-exercise').selectOption(rowExercises[i][0]);
              }
            }
            const fallback = await page.evaluate(async () => {
              let calls = 0, retryPayload;
              window.sbWrite = async (url, method, payload) => {
                calls++;
                if (calls === 1) throw new Error('column training_day does not exist');
                retryPayload = payload;
                return payload.map((x,i) => ({...x,id:i+1}));
              };
              await window.saveWorkoutNineTable();
              return { calls, retryPayload };
            });
            assert.equal(fallback.calls, 2, 'optional-column error should trigger one compatibility retry');
            assert.equal(fallback.retryPayload.length, 14);
            assert.ok(fallback.retryPayload.every(x => !('training_day' in x) && !('is_completed' in x)));
            console.log('PASS: actual save handler validated 9-row payload, training-system values, rest/reps/sets, grouping keys, and optional-column retry using mocked storage only.');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node nine-row-save-check.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-row-workout-table-preview
          path: |
            nine-row-table-mobile.png
            nine-row-table-desktop.png
          if-no-files-found: ignore
