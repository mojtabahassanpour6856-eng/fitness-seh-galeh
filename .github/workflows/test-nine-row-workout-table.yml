name: Nine-row workout table browser test

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/test-nine-row-workout-table.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workout-table-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --save-dev --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Verify nine-row table in desktop and mobile browser
        run: |
          cat > nine-row-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'domcontentloaded' });
            await page.addStyleTag({ content: '#authScreen { display:none !important; }' });
            const section = page.locator('#workout');
            await section.evaluate(el => el.classList.add('active'));
            const table = page.locator('#workoutNineTable');
            await table.waitFor();
            assert.equal(await table.locator('tbody tr').count(), 9, 'table must contain exactly nine rows');
            const expected = ['normal','superset','triset','giant','drop','rest_pause','timed','multi_stage','forced_reps','negative_reps','pyramid','reverse_pyramid','partial_reps','myo_reps','cluster','tempo','mechanical_drop','fst7','twenty_one','custom'];
            for (const row of await table.locator('tbody tr').all()) {
              const systems = await row.locator('select.w9-system option').evaluateAll(opts => opts.map(o => o.value));
              assert.deepEqual(systems, expected, 'each row must expose all supported training systems');
              assert.equal(await row.locator('select.w9-exercise').count(), 1);
              assert.equal(await row.locator('.w9-movement-checklist').count(), 1);
              assert.equal(await row.locator('input.w9-rest').count(), 1);
              assert.equal(await row.locator('input.w9-reps').count(), 1);
              assert.equal(await row.locator('input.w9-sets').count(), 1);
            }
            // System-specific defaults and guidance must update when a coach changes a row's system.
            const dynamicRow = table.locator('tbody tr').nth(8);
            await dynamicRow.locator('.w9-system').selectOption('fst7');
            assert.equal(await dynamicRow.locator('.w9-sets').inputValue(), '7', 'FST-7 should default to seven sets');
            assert.match(await dynamicRow.locator('.w9-reps').getAttribute('placeholder'), /FST-7|تکرار هر ست|تکرار/, 'FST-7 should provide reps guidance');
            await dynamicRow.locator('.w9-system').selectOption('twenty_one');
            assert.equal(await dynamicRow.locator('.w9-reps').inputValue(), '7+7+7', '21s should default to 7+7+7');
            assert.match(await dynamicRow.locator('.w9-reps').getAttribute('placeholder'), /21|بخش‌های/, '21s should explain the three parts');
            const twentyOneParts = dynamicRow.locator('.w9-special-part');
            assert.equal(await twentyOneParts.count(), 3, '21s must expose three separate editable fields');
            assert.equal(await twentyOneParts.nth(0).inputValue(), '7');
            assert.equal(await twentyOneParts.nth(1).inputValue(), '7');
            assert.equal(await twentyOneParts.nth(2).inputValue(), '7');
            await twentyOneParts.nth(1).fill('8');
            assert.equal(await dynamicRow.locator('.w9-reps').inputValue(), '7+8+7', '21s fields must serialize into the existing reps field');
            await dynamicRow.locator('.w9-system').selectOption('pyramid');
            assert.equal(await dynamicRow.locator('.w9-special-part').count(), 3, 'pyramid should expose editable stage values');
            assert.deepEqual(await dynamicRow.locator('.w9-special-part').evaluateAll(es => es.map(e => e.value)), ['12','10','8'], 'pyramid stages should have safe defaults');
            await dynamicRow.locator('.w9-special-part').nth(1).fill('9');
            assert.equal(await dynamicRow.locator('.w9-reps').inputValue(), '12/9/8', 'stage controls must serialize into existing reps storage');
            await dynamicRow.locator('.w9-system').selectOption('tempo');
            assert.equal(await dynamicRow.locator('.w9-special-part').count(), 3, 'tempo should expose three editable timing fields');
            assert.deepEqual(await dynamicRow.locator('.w9-special-part').evaluateAll(es => es.map(e => e.value)), ['3','1','2'], 'tempo should default to negative/pause/positive timing');
            await dynamicRow.locator('.w9-special-part').nth(0).fill('4');
            assert.equal(await dynamicRow.locator('.w9-reps').inputValue(), '4-1-2', 'tempo fields must serialize into existing reps storage');
            await dynamicRow.locator('.w9-system').selectOption('timed');
            assert.equal(await dynamicRow.locator('.w9-reps').inputValue(), '30 ثانیه', 'timed work should default to 30 seconds');
            assert.match(await dynamicRow.locator('.w9-reps').getAttribute('placeholder'), /مدت زمان/, 'timed work should request duration rather than reps');
            // Group systems should reveal checkboxes on the same row, with the required selection count.
            const groupingRows = await table.locator('tbody tr').all();
            await groupingRows[0].locator('.w9-system').selectOption('superset');
            assert.equal(await groupingRows[0].locator('.w9-group-movement-toggle').isVisible(), true, 'superset should expose the same-row movement picker');
            await groupingRows[0].locator('.w9-group-movement-toggle').click();
            assert.equal(await groupingRows[0].locator('.w9-movement-checklist').isVisible(), true, 'superset movement checklist should open on demand');
            await groupingRows[3].locator('.w9-system').selectOption('triset');
            assert.equal(await groupingRows[3].locator('.w9-group-movement-toggle').isVisible(), true, 'triset should expose the same-row movement picker');
            await groupingRows[3].locator('.w9-group-movement-toggle').click();
            assert.equal(await groupingRows[3].locator('.w9-movement-checklist').isVisible(), true, 'triset movement checklist should open on demand');
            await groupingRows[6].locator('.w9-system').selectOption('giant');
            assert.equal(await groupingRows[6].locator('.w9-group-movement-toggle').isVisible(), true, 'giant set should expose the same-row movement picker');
            await groupingRows[6].locator('.w9-group-movement-toggle').click();
            assert.equal(await groupingRows[6].locator('.w9-movement-checklist').isVisible(), true, 'giant-set movement checklist should open on demand');
            // Simulate the exercise list becoming available; the table should mirror its options.
            await page.locator('#workoutExercise').evaluate(sel => {
              const opt = document.createElement('option');
              opt.value = 'test-exercise-id';
              opt.textContent = 'حرکت آزمایشی';
              sel.appendChild(opt);
            });
            await page.waitForFunction(() => {
              const sel = document.querySelector('#workoutNineTable .w9-exercise');
              return !!sel && Array.from(sel.options).some(o => o.value === 'test-exercise-id');
            });
            await page.waitForFunction(() => {
              const box = document.querySelector('#workoutNineTable .w9-movement-checklist');
              return !!box && Array.from(box.querySelectorAll('input')).some(o => o.value === 'test-exercise-id');
            });
            assert.equal(await table.locator('tbody tr').first().locator('.w9-movement-checklist input[value="test-exercise-id"]').count(), 1, 'exercise options should sync into the same-row checklist');

            // A muscle/template change can replace the source bank options. Selected row
            // movements and prescription values must survive even when absent from the new filter.
            const source = page.locator('#workoutExercise');
            await source.evaluate(sel => {
              sel.innerHTML = '<option value="">انتخاب حرکت…</option><option value="preserve-a">حرکت حفظ‌شونده الف</option><option value="preserve-b">حرکت حفظ‌شونده ب</option>';
            });
            await page.waitForFunction(() => {
              const box = document.querySelector('#workoutNineTable tbody tr .w9-movement-checklist');
              return box && box.querySelector('input[value="preserve-a"]') && box.querySelector('input[value="preserve-b"]');
            });
            const preserveRow = table.locator('tbody tr').first();
            await preserveRow.locator('.w9-system').selectOption('superset');
            await preserveRow.locator('.w9-group-movement-toggle').click();
            await preserveRow.locator('.w9-movement-checklist input[value="preserve-a"]').check();
            await preserveRow.locator('.w9-movement-checklist input[value="preserve-b"]').check();
            await preserveRow.locator('.w9-rest').evaluate(el => { el.value = '45'; if (el.nextElementSibling?.classList.contains('seh-touch-choice-select')) el.nextElementSibling.value = '45'; });
            await preserveRow.locator('.w9-reps').evaluate(el => { el.value = '12'; if (el.nextElementSibling?.classList.contains('seh-touch-choice-select')) el.nextElementSibling.value = '12'; });
            await preserveRow.locator('.w9-sets').evaluate(el => { el.value = '4'; if (el.nextElementSibling?.classList.contains('seh-touch-choice-select')) el.nextElementSibling.value = '4'; });
            await source.evaluate(sel => { sel.innerHTML = '<option value="">انتخاب حرکت…</option><option value="new-filter-only">حرکت فیلتر جدید</option>'; });
            await page.waitForFunction(() => {
              const box = document.querySelector('#workoutNineTable tbody tr .w9-movement-checklist');
              return box && box.querySelector('input[value="new-filter-only"]');
            });
            assert.equal(await preserveRow.locator('.w9-movement-checklist input[value="preserve-a"]').isChecked(), true, 'first selected movement must survive a template/filter change');
            assert.equal(await preserveRow.locator('.w9-movement-checklist input[value="preserve-b"]').isChecked(), true, 'second selected movement must survive a template/filter change');
            assert.equal(await preserveRow.locator('.w9-system').inputValue(), 'superset', 'selected training system must survive a template/filter change');
            assert.equal(await preserveRow.locator('.w9-rest').inputValue(), '45', 'rest setting must survive a template/filter change');
            assert.equal(await preserveRow.locator('.w9-reps').inputValue(), '12', 'reps setting must survive a template/filter change');
            assert.equal(await preserveRow.locator('.w9-sets').inputValue(), '4', 'sets setting must survive a template/filter change');

            await page.setViewportSize({ width: 390, height: 844 });
            const mobile = await page.locator('.workout-nine-table-scroll').evaluate(el => ({
              overflowX: getComputedStyle(el).overflowX,
              clientWidth: el.clientWidth,
              scrollWidth: el.scrollWidth
            }));
            assert.ok(['auto','scroll'].includes(mobile.overflowX), 'mobile table wrapper must allow horizontal scrolling');
            await page.screenshot({ path: 'nine-row-table-mobile.png', fullPage: false });
            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.screenshot({ path: 'nine-row-table-desktop.png', fullPage: false });
            console.log(JSON.stringify({ rows: 9, systems: expected, movementOptionsSync: true, mobile }, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node nine-row-check.cjs
      - name: Interactively verify dynamic rows and row-11 controls
        run: |
          cat > dynamic-row-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'domcontentloaded' });
            await page.addStyleTag({ content: '#authScreen { display:none !important; }' });
            await page.locator('#workout').evaluate(el => el.classList.add('active'));
            await page.locator('#workoutNineTable').waitFor();
            const table = page.locator('#workoutNineTable');
            assert.equal(await table.locator('tbody tr').count(), 9, 'editor should begin with nine rows');
            const expanded = await page.evaluate(() => {
              if (typeof window.__sehEnsureWorkoutRows !== 'function') throw new Error('dynamic row helper was not exposed');
              window.__sehEnsureWorkoutRows(11);
              return {
                rows: document.querySelectorAll('#workoutNineTable tbody tr').length,
                row11SystemOptions: Array.from(document.querySelector('#workoutNineTable tbody tr:nth-child(11) .w9-system')?.options || []).map(o => o.value),
                touchChoices: document.querySelectorAll('#workoutNineTable tbody tr:nth-child(11) .seh-touch-choice-select').length
              };
            });
            assert.equal(expanded.rows, 11, 'editor should expand to eleven rows');
            assert.ok(expanded.row11SystemOptions.includes('superset'), 'row 11 should expose superset option');
            assert.equal(expanded.touchChoices, 3, 'row 11 should initialize rest, reps, and sets touch selectors');
            const row11 = table.locator('tbody tr').nth(10);
            await row11.locator('.w9-system').selectOption('superset');
            const toggle = row11.locator('.w9-group-movement-toggle');
            assert.equal(await toggle.count(), 1, 'row 11 should have a movement-group toggle');
            assert.equal(await toggle.isVisible(), true, 'row 11 movement-group toggle should be visible for superset');
            await toggle.click();
            assert.equal(await row11.locator('.w9-movement-checklist').isVisible(), true, 'row 11 movement checklist should open');
            const repSource = row11.locator('.w9-reps');
            await repSource.evaluate(el => { el.value = '12+8'; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); });
            const repState = await repSource.inputValue();
            assert.equal(repState, '12+8', 'custom rep format should be retained in source field');
            await page.evaluate(() => window.__sehEnsureWorkoutRows(9));
            assert.equal(await table.locator('tbody tr').count(), 9, 'editor should shrink to nine rows when switching to a shorter session');
            console.log(JSON.stringify({ initialRows: 9, expandedRows: expanded.rows, row11SupersetControls: true, touchChoices: expanded.touchChoices, customRep: repState, shrunkRows: 9 }, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node dynamic-row-check.cjs
      - name: Load, edit, save, and reload an existing workout plan (isolated mock DB)
        run: |
          cat > saved-plan-edit-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
            const dialogs = [];
            page.on('dialog', d => { dialogs.push(d.message()); d.accept(); });
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'domcontentloaded' });
            await page.addStyleTag({ content: '#authScreen { display:none !important; }' });
            await page.locator('#workout').evaluate(el => el.classList.add('active'));
            await page.locator('#workoutNineTable').waitFor();
            const seed = [];
            // Ten visible groups / eleven movements, matching the real legacy edge case.
            seed.push({id:1,workout_plan_id:444,exercise_id:101,sets:3,reps:'10',rest_seconds:60,sort_order:10,training_system:'superset',group_key:'test-superset',training_day:'جلسه اول',is_completed:false});
            seed.push({id:2,workout_plan_id:444,exercise_id:102,sets:3,reps:'10',rest_seconds:60,sort_order:10,training_system:'superset',group_key:'test-superset',training_day:'جلسه اول',is_completed:false});
            for (let i = 0; i < 9; i++) seed.push({id:i+3,workout_plan_id:444,exercise_id:103+i,sets:2+i%3,reps:String(8+i),rest_seconds:45+i,sort_order:(i+2)*10,training_system:'normal',group_key:null,training_day:'جلسه اول',is_completed:false});
            await page.evaluate((seedRows) => {
              window.__mockPlans = [{id:444,trainee_id:'test-trainee',title:'Plan for edit test',goal:'strength',notes:'mock only',plan_date:'2026-10-20'}];
              window.__mockSavedRows = seedRows.map(x => ({...x}));
              window.__mockExercises = seedRows.map(x => ({id:x.exercise_id,name:'Test movement '+x.exercise_id})).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);
              window.__mockWrites = [];
              window.sbGet = async (url) => {
                if (url.startsWith('/trainee_workout_plans')) return window.__mockPlans;
                if (url.startsWith('/exercises')) {
                  const match = url.match(/id=in\.\(([^)]+)\)/);
                  if (!match) return window.__mockExercises;
                  const ids = match[1].split(',').map(decodeURIComponent);
                  return window.__mockExercises.filter(x => ids.includes(String(x.id)));
                }
                if (url.startsWith('/trainee_workout_exercises')) {
                  let rows = window.__mockSavedRows.slice();
                  const plan = url.match(/workout_plan_id=eq\.([^&]+)/);
                  if (plan) rows = rows.filter(x => String(x.workout_plan_id) === decodeURIComponent(plan[1]));
                  const day = url.match(/training_day=eq\.([^&]+)/);
                  if (day) rows = rows.filter(x => String(x.training_day) === decodeURIComponent(day[1]));
                  return rows.sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||Number(a.id)-Number(b.id));
                }
                return [];
              };
              window.sbWrite = async (url, method, payload) => {
                window.__mockWrites.push({url,method,payload});
                if (method === 'PATCH') {
                  const id = decodeURIComponent((url.match(/id=eq\.([^&]+)/)||[])[1]||'');
                  const index = window.__mockSavedRows.findIndex(x => String(x.id) === id && url.includes('workout_plan_id=eq.444'));
                  if (index < 0) return [];
                  window.__mockSavedRows[index] = {...window.__mockSavedRows[index], ...payload};
                  return [window.__mockSavedRows[index]];
                }
                if (method === 'POST') {
                  const rows = payload.map((x,i)=>({...x,id:Math.max(0,...window.__mockSavedRows.map(r=>Number(r.id)||0))+i+1}));
                  window.__mockSavedRows.push(...rows);
                  return rows;
                }
                if (method === 'DELETE') {
                  const id = decodeURIComponent((url.match(/id=eq\.([^&]+)/)||[])[1]||'');
                  window.__mockSavedRows = window.__mockSavedRows.filter(x => String(x.id) !== id);
                  return [];
                }
                throw new Error('Unexpected mocked write: '+method);
              };
              eval('currentClient = {id:"test-trainee", goal:"strength"}; currentWorkoutPlanId = null; workoutExercisesCache = [];');
            }, seed);
            await page.evaluate(async () => { await window.loadWorkoutForClient(); });
            const table = page.locator('#workoutNineTable');
            assert.equal(await table.locator('tbody tr').count(), 10, 'loading the saved plan should expand to ten movement groups');
            const first = table.locator('tbody tr').nth(0);
            assert.equal(await first.locator('.w9-system').inputValue(), 'superset', 'saved superset system should be restored');
            assert.equal(await first.locator('.w9-movement-checklist input:checked').count(), 2, 'both movements in the saved superset should be restored');
            const last = table.locator('tbody tr').nth(9);
            assert.equal(await last.locator('.w9-exercise').inputValue(), '111', 'the tenth saved group should load into row ten');
            assert.equal(await last.locator('.w9-sets').inputValue(), '4', 'saved prescription should be restored in the last row');
            await last.locator('.w9-sets').evaluate(el => { el.value='5'; el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); if(el.nextElementSibling?.classList.contains('seh-touch-choice-select')) el.nextElementSibling.value='5'; });
            await last.locator('.w9-system').selectOption('twenty_one');
            assert.equal(await last.locator('.w9-special-part').count(), 3, '21-rep fields should be available on an existing saved row');
            await last.locator('.w9-special-part').nth(0).fill('7');
            await last.locator('.w9-special-part').nth(1).fill('8');
            await last.locator('.w9-special-part').nth(2).fill('7');
            const writesBeforeInvalid21 = await page.evaluate(() => window.__mockWrites.length);
            await page.evaluate(async () => { await window.saveWorkoutNineTable(); });
            assert.match(dialogs.at(-1)||'', /مجموع.*۲۱|۲۱.*مجموع/, 'invalid 21-rep totals should be rejected with a clear message');
            assert.equal(await page.evaluate(() => window.__mockWrites.length), writesBeforeInvalid21, 'invalid 21-rep prescription must not write to the mock database');
            await last.locator('.w9-special-part').nth(0).fill('7');
            await last.locator('.w9-special-part').nth(1).fill('7');
            await last.locator('.w9-special-part').nth(2).fill('7');
            assert.equal(await last.locator('.w9-reps').inputValue(), '7+7+7', '21-rep prescription should serialize before saving');
            await page.evaluate(async () => { await window.saveWorkoutNineTable(); });
            assert.equal(await table.locator('tbody tr').count(), 10, 'save and automatic reload must preserve the expanded session');
            assert.equal(await page.evaluate(() => window.__mockSavedRows.length), 11, 'editing must preserve all eleven movement records without duplicates');
            assert.equal(await page.evaluate(() => window.__mockSavedRows.find(x=>x.id===11).sets), 5, 'changed sets must be persisted on the existing movement row');
            assert.equal(await page.evaluate(() => window.__mockSavedRows.find(x=>x.id===11).training_system), 'twenty_one', 'specialized training system must persist on the existing movement row');
            assert.equal(await page.evaluate(() => window.__mockSavedRows.find(x=>x.id===11).reps), '7+7+7', '21-rep stage values must persist in the existing reps field');
            assert.equal(await page.evaluate(() => window.__mockWrites.filter(x=>x.method==='POST').length), 0, 'editing a fully populated saved session must not insert duplicate records');
            assert.equal(await page.evaluate(() => window.__mockWrites.filter(x=>x.method==='PATCH').length), 11, 'each existing movement record should be updated in place');
            await page.evaluate(async () => { await window.loadWorkoutForClient(); });
            assert.equal(await table.locator('tbody tr').count(), 10, 'a fresh reload must still restore all ten movement groups');
            assert.equal(await table.locator('tbody tr').nth(9).locator('.w9-sets').inputValue(), '5', 'the edited value must survive a fresh reload');
            assert.equal(await table.locator('tbody tr').nth(9).locator('.w9-system').inputValue(), 'twenty_one', '21-rep system must survive a fresh reload');
            assert.deepEqual(await table.locator('tbody tr').nth(9).locator('.w9-special-part').evaluateAll(es => es.map(e => e.value)), ['7','7','7'], '21-rep fields must be reconstructed after reload');
            assert.equal(await table.locator('tbody tr').nth(0).locator('.w9-movement-checklist input:checked').count(), 2, 'grouped movement selection must survive a fresh reload');
            console.log(JSON.stringify({ loadedGroups:10, loadedMovements:11, supersetRestored:true, editedExistingRow:true, duplicateInserts:0, freshReloadPreservedEdit:true, twentyOneRepSavedAndRestored:true, database:'isolated in-memory mock only' }, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node saved-plan-edit-check.cjs
      - name: Verify exact exercise muscle filtering
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('function match(r,m){');
          const end = html.indexOf('function active(', start);
          assert.ok(start >= 0 && end > start, 'could not locate exercise-bank muscle matcher');
          const source = html.slice(start, end).trim();
          const match = new Function('favs', 'n', 'kw', source + '; return match;')(new Set(), v => String(v || '').toLocaleLowerCase('fa').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[\\u200c\\s_-]+/g,' ').trim(), {
            'پشت': ['پشت','زیر بغل','زیربغل','لت','قایقی','ددلیفت','back','lat pulldown','row'],
            'پشت بازو': ['پشت بازو','triceps','tricep','pushdown']
          });
          assert.equal(match({name:'پشت بازو سیم‌کش',category:'پشت بازو'}, 'پشت'), false, 'triceps must not leak into back filter');
          assert.equal(match({name:'قایقی دستگاه',category:'پشت'}, 'پشت'), true, 'back-category exercise should appear under back');
          assert.equal(match({name:'لت سیم‌کش',category:'پشت'}, 'پشت'), true, 'lat exercise should appear under back');
          assert.equal(match({name:'قایقی دستگاه',category:'پشت'}, 'پشت بازو'), false, 'back-category exercise must not leak into triceps filter');
          console.log('PASS: muscle filter uses saved category fields and does not match unrelated exercise names.');
          NODE
      - name: Verify save handler safeguards and batch insert
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('window.saveWorkoutNineTable=async function');
          assert.ok(start >= 0, 'nine-row save handler must exist');
          const end = html.indexOf('function start(){', start);
          assert.ok(end > start, 'could not find end of nine-row save handler');
          const handler = html.slice(start, end);
          assert.match(handler, /workout_plan_id:currentWorkoutPlanId/, 'must use current plan id, not a window property');
          assert.match(handler, /sbWrite\('\/trainee_workout_exercises','POST',payloads\)/, 'must use one multi-row insert');
          assert.match(handler, /inserted\.length!==payloads\.length/, 'must check all rows were returned');
          assert.match(handler, /training_day\|is_completed/i, 'must retain optional-column compatibility fallback');
          assert.match(html, /legacyPreviewOnly=unassignedRows\.length>0&&labelledRows\.length===0/, 'unlabelled legacy rows may only be previewed when the entire plan is unlabelled');
          assert.match(html, /if\(day===0&&legacyPreviewOnly\)dayRows=unassignedRows/, 'legacy rows must be surfaced in the editor rather than silently appearing as an empty plan');
          assert.match(html, /ذخیره و ویرایش تا مشخص‌شدن جلسه/, 'legacy preview must visibly warn that editing is blocked to protect ambiguous rows');
          assert.match(html, /legacyUnassignedRows&&sessionRows\.length===0/, 'must refuse to write when the target session cannot be safely identified');
          assert.match(html, /function ensureTableRows\(count\)/, 'must expand the existing editor table when a saved session has more than nine movement groups');
          assert.match(html, /ensureTableRows\(Math\.max\(9,data\?data\.length:9\)\)/, 'must restore every saved group instead of truncating after row nine');
          assert.match(html, /window\.__sehBindNineSystemGrouping=bindNineSystemGrouping/, 'dynamically added rows must receive the same grouping controls');
          assert.match(html, /existingGroups\[r\.index\]/, 'must match saved groups to their actual table row index');
          assert.match(html, /wantedByIndex=new Map\(wanted\.map\(r=>\[r\.index,r\]\)\)/, 'must delete only the saved group corresponding to an intentionally cleared row');
          console.log('PASS: save safeguards, legacy preview, dynamic row expansion, and row-index-safe edits.');
          NODE
      - name: Exercise the actual save handler with a mocked database (no live data)
        run: |
          cat > nine-row-save-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            page.on('dialog', d => d.accept());
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'domcontentloaded' });
            await page.addStyleTag({ content: '#authScreen { display:none !important; }' });
            await page.locator('#workout').evaluate(el => el.classList.add('active'));
            await page.evaluate(() => {
              const source = document.querySelector('#workoutExercise');
              for (let i = 1; i <= 10; i++) {
                const o = document.createElement('option'); o.value = 'test-exercise-' + i; o.textContent = 'حرکت آزمایشی ' + i; source.appendChild(o);
              }
              // Assign the app's top-level lexical state without authenticating or touching Supabase.
              eval('currentClient = { id: "test-trainee" }; currentWorkoutPlanId = 123; workoutExercisesCache = [];');
              window.loadWorkoutForClient = async () => {};
            });
            await page.waitForFunction(() => {
              const boxes = Array.from(document.querySelectorAll('#workoutNineTable tbody tr .w9-movement-checklist'));
              return boxes.length === 9 && boxes.every(box => Array.from({length: 10}, (_,i) => 'test-exercise-' + (i + 1)).every(id => box.querySelector('input[value="' + id + '"]')));
            });
            const rows = await page.locator('#workoutNineTable tbody tr').all();
            const systems = ['normal','superset','triset','giant','drop','rest_pause','timed','multi_stage','custom'];
            const rowExercises = [['test-exercise-1'],['test-exercise-2','test-exercise-3'],['test-exercise-4','test-exercise-5','test-exercise-6'],['test-exercise-7','test-exercise-8','test-exercise-9','test-exercise-10'],['test-exercise-1'],['test-exercise-2'],['test-exercise-3'],['test-exercise-4'],['test-exercise-5']];
            for (let i = 0; i < rows.length; i++) {
              await rows[i].locator('.w9-system').selectOption(systems[i]);
              if (['superset','triset','giant'].includes(systems[i])) {
                for (const id of rowExercises[i]) await rows[i].locator('.w9-exercise-check[value="' + id + '"]').evaluate(el => { el.checked = true; el.dispatchEvent(new Event("input", { bubbles: true })); el.dispatchEvent(new Event("change", { bubbles: true })); });
              } else {
                await rows[i].locator('.w9-exercise').selectOption(rowExercises[i][0]);
              }
              // These numeric fields are enhanced with visible touch-choice controls; set the underlying inputs directly in this isolated browser test.
              await rows[i].evaluate((tr, values) => {
                for (const [selector, value] of values) {
                  const input = tr.querySelector(selector);
                  input.value = value;
                  input.dispatchEvent(new Event('input', { bubbles: true }));
                  input.dispatchEvent(new Event('change', { bubbles: true }));
                }
              }, [
                ['.w9-rest', String(30 + i)],
                ['.w9-reps', i === 4 ? '12+8+6' : String(8 + i)],
                ['.w9-sets', String(2 + (i % 3))]
              ]);
            }
            const first = await page.evaluate(async () => {
              let captured;
              window.__mockSavedRows = [];
              window.__mockWriteCalls = [];
              window.sbGet = async url => {
                if (url.includes('/trainee_workout_exercises')) {
                  const rows = window.__mockSavedRows;
                  if (url.includes('training_day=eq.')) return rows.filter(x => x.training_day === 'جلسه اول');
                  return rows;
                }
                return [];
              };
              window.sbWrite = async (url, method, payload) => {
                captured = { url, method, payload };
                window.__mockWriteCalls.push({url,method,payload});
                if (method === 'POST') {
                  const inserted = payload.map((x,i) => ({...x,id:window.__mockSavedRows.length+i+1}));
                  window.__mockSavedRows.push(...inserted);
                  return inserted;
                }
                if (method === 'PATCH') {
                  const id = decodeURIComponent((url.match(/id=eq\.([^&]+)/)||[])[1]||'');
                  const index = window.__mockSavedRows.findIndex(x => String(x.id) === String(id));
                  if (index >= 0) window.__mockSavedRows[index] = {...window.__mockSavedRows[index],...payload};
                  return index >= 0 ? [window.__mockSavedRows[index]] : [];
                }
                if (method === 'DELETE') {
                  const id = decodeURIComponent((url.match(/id=eq\.([^&]+)/)||[])[1]||'');
                  window.__mockSavedRows = window.__mockSavedRows.filter(x => String(x.id) !== String(id));
                  return [];
                }
                throw new Error('Unexpected mocked method: '+method);
              };
              await window.saveWorkoutNineTable();
              return captured;
            });
            assert.equal(first.url, '/trainee_workout_exercises');
            assert.equal(first.method, 'POST');
            const expectedIds = rowExercises.flat();
            const expectedSystems = systems.flatMap(s => [s, ...(s === 'superset' ? [s] : s === 'triset' ? [s,s] : s === 'giant' ? [s,s,s] : [])]);
            assert.equal(first.payload.length, 15, 'same-row grouped movements must all be sent together');
            assert.deepEqual(first.payload.map(x => x.training_system), expectedSystems);
            assert.deepEqual(first.payload.map(x => x.exercise_id), expectedIds);
            assert.ok(first.payload.every(x => x.workout_plan_id === 123));
            assert.equal(first.payload[1].group_key, first.payload[2].group_key, 'two same-row superset movements must share a group key');
            assert.equal(first.payload[3].group_key, first.payload[5].group_key, 'three same-row triset movements must share a group key');
            assert.equal(first.payload[6].group_key, first.payload[9].group_key, 'four same-row giant-set movements must share a group key');
            assert.equal(first.payload[0].group_key, null);
            assert.equal(first.payload[10].group_key, null);
            // Editing the same saved session must PATCH existing IDs, not append a duplicate plan/session.
            await rows[0].locator('.w9-sets').evaluate(el => { el.value = '5'; if (el.nextElementSibling?.classList.contains('seh-touch-choice-select')) el.nextElementSibling.value = '5'; });
            const editResult = await page.evaluate(async () => {
              await window.saveWorkoutNineTable();
              return {
                writes: window.__mockWriteCalls.map(x => x.method),
                rowCount: window.__mockSavedRows.length,
                firstRow: window.__mockSavedRows.find(x => String(x.id) === '1')
              };
            });
            assert.equal(editResult.rowCount, 15, 'editing a saved session must not duplicate its 15 exercise rows');
            assert.equal(editResult.writes.filter(x => x === 'POST').length, 1, 'the second save must not insert duplicate movements');
            assert.equal(editResult.writes.filter(x => x === 'PATCH').length, 15, 'the second save should update existing movement rows');
            assert.equal(String(editResult.firstRow.sets), '5', 'the changed set count must be persisted to the existing row');

            // If session metadata cannot be read, refuse to write rather than guess which saved session to overwrite.
            for (let i = 0; i < rows.length; i++) {
              await rows[i].locator('.w9-system').selectOption(systems[i]);
              if (['superset','triset','giant'].includes(systems[i])) {
                for (const id of rowExercises[i]) await rows[i].locator('.w9-exercise-check[value="' + id + '"]').evaluate(el => { el.checked = true; el.dispatchEvent(new Event("change", { bubbles: true })); });
              } else {
                await rows[i].locator('.w9-exercise').selectOption(rowExercises[i][0]);
              }
            }
            const fallback = await page.evaluate(async () => {
              let writes = 0;
              window.sbGet = async url => {
                if (url.includes('/trainee_workout_exercises')) throw new Error('column training_day does not exist');
                return [];
              };
              window.sbWrite = async () => { writes++; return []; };
              await window.saveWorkoutNineTable();
              return { writes };
            });
            assert.equal(fallback.writes, 0, 'when session identity cannot be read, the editor must stop before writing to avoid duplicate or misplaced movements');
            console.log('PASS: actual save handler validated 9-row payload, grouped systems, and safe no-write behavior when session metadata is unavailable; mocked storage only.');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node nine-row-save-check.cjs
