name: Auth recovery paths integration regression
on:
  pull_request:
    branches: [main]
    paths: ['index.html','tests/auth-recovery-paths-integration.test.mjs','.github/workflows/test-auth-recovery-paths-integration.yml']
  push:
    branches: [fix/pinned-supabase-loader-20261113]
    paths: ['index.html','tests/auth-recovery-paths-integration.test.mjs','.github/workflows/test-auth-recovery-paths-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-recovery-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/auth-recovery-paths-integration.test.mjs
