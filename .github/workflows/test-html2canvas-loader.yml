name: Bounded html2canvas loader test

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/html2canvas-loader.static.test.js'
      - '.github/workflows/test-html2canvas-loader.yml'
  push:
    branches:
      - fix/html2canvas-bounded-loader-20261113
    paths:
      - 'index.html'
      - 'tests/html2canvas-loader.static.test.js'
      - '.github/workflows/test-html2canvas-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html2canvas-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bounded CDN fallback behavior
        run: node tests/html2canvas-loader.static.test.js
