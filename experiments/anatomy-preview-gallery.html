<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f0df">
<title>گالری چهار نمای آناتومی | فیتنس سه‌قلعه</title>
<style>
:root{--paper:#f7f0df;--card:#fffdf7;--gold:#98752d;--line:#ddc995;--ink:#302819}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{max-width:1600px;margin:0 auto 20px;text-align:center}
h1{font-size:25px;margin:0 0 8px;color:var(--gold)}
header p{margin:0;line-height:1.9}
.grid{max-width:1600px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
figure{margin:0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #604b1a12}
figcaption{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line)}
iframe{display:block;width:100%;height:1180px;border:0;background:var(--paper)}
.note{max-width:1600px;margin:18px auto 0;padding:12px 16px;background:#fff8e9;border:1px solid var(--line);border-radius:10px;line-height:1.9;font-size:13px}
@media(max-width:850px){body{padding:10px}.grid{grid-template-columns:1fr}iframe{height:1050px}h1{font-size:20px}}
@media print{body{padding:0}.grid{gap:8px}figure{break-inside:avoid;box-shadow:none}iframe{height:1100px}}
</style>
</head>
<body>
<header>
<h1>گالری چهار نمای آناتومی هوشمند</h1>
<p>باشگاه فیتنس سه‌قلعه | نسخه آزمایشی مستقل</p>
</header>
<main class="grid">
<figure><figcaption>۱. نمای جلوی بدن آقا</figcaption><iframe title="نمای جلوی بدن آقا" loading="eager" src="./anatomy-preview-capture.html?view=male-front"></iframe></figure>
<figure><figcaption>۲. نمای پشت بدن آقا</figcaption><iframe title="نمای پشت بدن آقا" loading="eager" src="./anatomy-preview-capture.html?view=male-back"></iframe></figure>
<figure><figcaption>۳. نمای جلوی بدن خانم</figcaption><iframe title="نمای جلوی بدن خانم" loading="eager" src="./anatomy-preview-capture.html?view=female-front"></iframe></figure>
<figure><figcaption>۴. نمای پشت بدن خانم</figcaption><iframe title="نمای پشت بدن خانم" loading="eager" src="./anatomy-preview-capture.html?view=female-back"></iframe></figure>
</main>
<p class="note">توجه: این گالری برای بازبینی بصری نسخه آزمایشی است. نمایش مسیرها و رنگ‌ها به‌تنهایی تأییدکننده مرزبندی یا صحت آناتومیک عضلات نیست. گروه‌هایی که هندسه معتبر ندارند همچنان باید غیرفعال یا نیازمند بازبینی باقی بمانند.</p>
</body>
</html>
